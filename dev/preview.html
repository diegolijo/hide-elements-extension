<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Preview del panel</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #1c1c1c; background: #f6f4ef; }
    header, main, footer { padding: 16px 20px; }
    header { background: #1f3a34; color: white; }
    nav a { color: #d7efe4; margin-right: 12px; }
    .layout { display: flex; gap: 16px; align-items: flex-start; }
    .cards { display: flex; gap: 8px; }
    .card, aside, footer { background: white; border-radius: 8px; }
    .card { padding: 12px; border: 1px solid #ddd; }
    .lead { color: #3d6b5a; margin: 0 0 8px; }
    aside { padding: 12px 16px; }
    footer { margin: 0 20px 20px; }
  </style>
</head>
<body>
  <header id="site-header">
    <h1>Página de prueba</h1>
    <nav>
      <a href="#uno">Uno</a>
      <a href="#dos">Dos</a>
    </nav>
  </header>
  <main class="layout">
    <section class="cards" id="galeria">
      <article class="card" id="uno">
        <h2>Tarjeta</h2>
        <p class="lead">Texto de la tarjeta</p>
        <button type="button">Acción</button>
      </article>
      <article class="card" id="dos">
        <h2>Otra</h2>
        <p>Segunda tarjeta</p>
      </article>
      <article class="card">
        <h2>Tercera</h2>
        <p>Tercera tarjeta</p>
      </article>
    </section>
    <aside>
      <ul>
        <li>Alfa</li>
        <li>Beta</li>
        <li>Gamma</li>
      </ul>
    </aside>
  </main>
  <footer>Pie de la página de prueba</footer>
  <script>
    globalThis.chrome = {
      runtime: {
        sendMessage: function () {},
        onMessage: { addListener: function () {} }
      }
    };
  </script>
  <script src="../content.js"></script>
  <script src="../panel.js"></script>
  <script src="../editor.js"></script>
  <script>
    __dn.setEnabled(true);
  </script>
</body>
</html>
